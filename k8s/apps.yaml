# The subscriber on daprd 1.19.0 with the tracing Configuration from dapr.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub-rate-1
  namespace: kafka-tracing-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: sub-rate-1}
  template:
    metadata:
      labels: {app: sub-rate-1}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "sub-rate-1"
        dapr.io/app-port: "8080"
        dapr.io/config: "tracing"
    spec:
      containers:
      - name: app
        image: eclipse-temurin:21-jdk
        command: ["java", "/app/RawXmlSubscriber.java"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - {name: src, mountPath: /app}
      volumes:
      - name: src
        configMap: {name: subscriber-src}
