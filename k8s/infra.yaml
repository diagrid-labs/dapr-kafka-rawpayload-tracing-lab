apiVersion: v1
kind: Namespace
metadata:
  name: kafka-tracing-lab
---
# Single-node Kafka (KRaft). Service is not called "kafka" on purpose: the
# apache/kafka image turns KAFKA_* env vars into broker config, and a "kafka"
# service would inject KAFKA_PORT etc.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker
  namespace: kafka-tracing-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka-broker}
  template:
    metadata:
      labels: {app: kafka-broker}
    spec:
      enableServiceLinks: false
      containers:
      - name: kafka
        image: apache/kafka:3.9.0
        ports:
        - containerPort: 9092
        readinessProbe:
          tcpSocket: {port: 9092}
          periodSeconds: 2
        env:
        - {name: KAFKA_NODE_ID, value: "1"}
        - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
        - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
        - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-broker.kafka-tracing-lab.svc.cluster.local:9092"}
        - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
        - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
        - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
        - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
        - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
        - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: kafka-tracing-lab
spec:
  selector: {app: kafka-broker}
  ports:
  - {port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: kafka-tracing-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: zipkin}
  template:
    metadata:
      labels: {app: zipkin}
    spec:
      containers:
      - name: zipkin
        image: openzipkin/zipkin:3
        ports:
        - containerPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: kafka-tracing-lab
spec:
  selector: {app: zipkin}
  ports:
  - {port: 9411, targetPort: 9411}
