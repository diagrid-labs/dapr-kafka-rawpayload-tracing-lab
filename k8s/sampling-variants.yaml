# Same subscriber on daprd 1.19.0 with different tracing settings.
# See "How the tracing config changes the result" in the README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub-no-config
  namespace: kafka-tracing-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: sub-no-config}
  template:
    metadata:
      labels: {app: sub-no-config}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "sub-no-config"
        dapr.io/app-port: "8080"
    spec:
      containers:
      - name: app
        image: eclipse-temurin:21-jdk
        command: ["java", "/app/RawXmlSubscriber.java"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - {name: src, mountPath: /app}
      volumes:
      - name: src
        configMap: {name: subscriber-src}
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: tracing-rate-0
  namespace: kafka-tracing-lab
spec:
  tracing:
    samplingRate: "0"
    zipkin:
      endpointAddress: "http://zipkin.kafka-tracing-lab.svc.cluster.local:9411/api/v2/spans"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub-rate-0
  namespace: kafka-tracing-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: sub-rate-0}
  template:
    metadata:
      labels: {app: sub-rate-0}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "sub-rate-0"
        dapr.io/app-port: "8080"
        dapr.io/config: "tracing-rate-0"
    spec:
      containers:
      - name: app
        image: eclipse-temurin:21-jdk
        command: ["java", "/app/RawXmlSubscriber.java"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - {name: src, mountPath: /app}
      volumes:
      - name: src
        configMap: {name: subscriber-src}
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: tracing-rate-low
  namespace: kafka-tracing-lab
spec:
  tracing:
    samplingRate: "0.0001"
    zipkin:
      endpointAddress: "http://zipkin.kafka-tracing-lab.svc.cluster.local:9411/api/v2/spans"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub-rate-low
  namespace: kafka-tracing-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: sub-rate-low}
  template:
    metadata:
      labels: {app: sub-rate-low}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "sub-rate-low"
        dapr.io/app-port: "8080"
        dapr.io/config: "tracing-rate-low"
    spec:
      containers:
      - name: app
        image: eclipse-temurin:21-jdk
        command: ["java", "/app/RawXmlSubscriber.java"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - {name: src, mountPath: /app}
      volumes:
      - name: src
        configMap: {name: subscriber-src}
