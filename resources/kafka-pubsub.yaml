apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "localhost:19092"
  - name: consumerGroup
    value: "{appID}"
  - name: authType
    value: "none"
  - name: initialOffset
    value: "oldest"
